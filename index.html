<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mad crasher Arcade</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="arcade-container">
    <canvas id="game-canvas" width="800" height="600"></canvas>
    <div id="top">
      <span>0000</span>
      <div>
        <span class="score">HI-SCORE</span>
        <span id="hi-score">10000</span>
      </div>
    </div>

    <div id="bottom">
      <span class="score">CREDITS</span>
      <span id="credits-display">00</span>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
