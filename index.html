<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mad crasher Arcade</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2308082a'/><polygon points='25,6 29,20 20,25 9,21 4,12' fill='%23e61c38'/><ellipse cx='18' cy='13' rx='5' ry='2.5' fill='%2300f0ff'/><rect x='7' y='19' width='4' height='3' fill='%23ffaa00'/></svg>">

  <link rel="stylesheet" href="styles/index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <div class = "main-menu">
  <div class = game-title>
    <h1 id="mad">Mad</h1>
    <h1 id="crasher">Crashers</h1>
  </div>
  <div class = "container">
    <div class = "game-launcher">
      <form action ="game.html" method="get" id="gameLauncherForm">
      <h2>Player Name</h2>
      <input type="text" id="playerName" name="player-name" placeholder="Enter your name" required>
      <button id="startGameBtn" type="submit">Start Game</button>
      </form>
      <h2>Instructions</h2>
      <p> Steering : A/D or Arrow keys</p>
      <p> Jump : Spacebar</p>
      <p> Shoot : Z or E</p>
    </div>
    <div class = "high-score">
      <h2>High Scores</h2>
      <table>
        <thead>
          <tr>
            <th>S.No</th>
            <th>Player Name</th>
            <th>Score</th>
          </tr>
        </thead>
        <tbody id="highScoreList"></tbody>
      </table>
    </div>
  </div>
  </div>
</body>
<script src="scripts/index.js"></script>
</html>
