<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mad crasher Arcade</title>
  <link rel="stylesheet" href="styles/index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <div class = "main-menu">
  <div class = game-title>
    <h1 id="mad">Mad</h1>
    <h1 id="crasher">Crashers</h1>
  </div>
  <div class = "container">
    <div class = "game-launcher">
      <p>Press Space to Start</p>
    </div>
    <div class = "high-score">
      <h2>High Scores</h2>
      <table>
        <thead>
          <tr>
            <th>S.No</th>
            <th>Player Name</th>
            <th>Score</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td>Player 1</td>
            <td>000000</td>
          </tr>
          <tr>
            <td>2</td>
            <td>Player 2</td>
            <td>000000</td>
          </tr>
          <tr>
            <td>3</td>
            <td>Player 3</td>
            <td>000000</td>
          </tr>
          <tr>
            <td>4</td>
            <td>Player 4</td>
            <td>000000</td>
          </tr>
          <tr>
            <td>5</td>
            <td>Player 5</td>
            <td>000000</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  </div>
</body>
</html>
