<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mad crasher Arcade</title>
  <link rel="stylesheet" href="styles/index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <div class = "main-menu">
  <div class = game-title>
    <h1 id="mad">Mad</h1>
    <h1 id="crasher">Crashers</h1>
  </div>
  <div class = "container">
    <div class = "game-launcher">
      <form action ="game.html" method="get" id="gameLauncherForm">
      <h2>Player Name</h2>
      <input type="text" id="playerName" name="player-name" placeholder="Enter your name" required>
      <button id="startGameBtn" type="submit">Start Game</button>
      </form>
    </div>
    <div class = "high-score">
      <h2>High Scores</h2>
      <table>
        <thead>
          <tr>
            <th>S.No</th>
            <th>Player Name</th>
            <th>Score</th>
          </tr>
        </thead>
        <tbody id="highScoreList"></tbody>
      </table>
    </div>
  </div>
  </div>
</body>
<script src="scripts/game.js"></script>
</html>
