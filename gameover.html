<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Over - Mad Crashers</title>
  <!-- Retro Arcade Jet-Bike Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2308082a'/><polygon points='25,6 29,20 20,25 9,21 4,12' fill='%23e61c38'/><ellipse cx='18' cy='13' rx='5' ry='2.5' fill='%2300f0ff'/><rect x='7' y='19' width='4' height='3' fill='%23ffaa00'/></svg>">

  <link rel="stylesheet" href="styles/index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <div class="main-menu">
    <div class="game-title">
      <h1 id="mad">Game</h1>
      <h1 id="crasher">Over</h1>
    </div>
    <div class="container">
      <div class="game-launcher">
        <h2>MISSION REPORT</h2>
        <div class="game-over-stats">
          <div class="stat-line">
            <span>PILOT:</span>
            <span id="playerNameDisplay" class="highlight">Player</span>
          </div>
          <div class="stat-line">
            <span>SCORE:</span>
            <span id="finalScoreDisplay" class="score-highlight">0</span>
          </div>
          <div id="highScoreBanner" class="new-high-score-banner" style="display: none;">
            ★ NEW HIGH SCORE! ★
          </div>
        </div>
        <div class="game-over-actions">
          <button id="playAgainBtn" class="arcade-btn" type="button">PLAY AGAIN</button>
          <button id="mainMenuBtn" class="arcade-btn secondary-btn" type="button">MAIN MENU</button>
        </div>
      </div>
      <div class="high-score">
        <h2>High Scores</h2>
        <table>
          <thead>
            <tr>
              <th>S.No</th>
              <th>Player Name</th>
              <th>Score</th>
            </tr>
          </thead>
          <tbody id="highScoreList"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="scripts/gameover.js"></script>
</body>
</html>
